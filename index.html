<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: #6366f1;
            --secondary-glow: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Animated Lighting Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-glow);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            background: var(--secondary-glow);
            bottom: -10%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(30px, 20px); }
        }

        /* Main Glass Card */
        .portal-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .header {
            margin-bottom: 35px;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Destination Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .nav-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3),
                        0 0 20px rgba(99, 102, 241, 0.15);
        }

        .icon-box {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .nav-card:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        .info-box {
            text-align: left;
            flex-grow: 1;
        }

        .card-title {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-path {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .arrow {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .nav-card:hover .arrow {
            transform: translateX(5px);
            color: #a5b4fc;
        }
    </style>
</head>
<body>

    <!-- Ambient background glows -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="portal-card">
        <div class="header">
            <span class="badge">Project Gateway</span>
            <h1>Select Portal</h1>
            <p>Choose which application you want to visit:</p>
        </div>

        <div class="cards-grid">
            <!-- Link 1: Food Delivery -->
            <a href="food%20dilervy/index.html" class="nav-card">
                <div class="icon-box">🍕</div>
                <div class="info-box">
                    <span class="card-title">Food Delivery App</span>
                    <span class="card-path">food dilervy/index.html</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Link 2: New Page -->
            <a href="new/index.html" class="nav-card">
                <div class="icon-box">🚀</div>
                <div class="info-box">
                    <span class="card-title">New Page</span>
                    <span class="card-path">new/index.html</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

</body>
</html>
